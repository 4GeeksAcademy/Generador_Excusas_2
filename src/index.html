<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />

    <title>Hello Rigo with Vanilla.js</title>
    <link
      rel="stylesheet"
      href="https://use.fontawesome.com/releases/v5.2.0/css/all.css"
      integrity="sha384-hWVjflwFxL6sNzntih27bfxkr27PmbbK/iSvJ+a4+0owXq79v+lsFkW54bOGbiDQ"
      crossorigin="anonymous"
    />
    <link rel="shortcut icon" href="./4geeks.ico" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <script>
      //Fragmentos de las excusas//
      let array1 = ["El perro", "El Hamster", "El pez", "La araña"]; //Quien lo provoco//
      let array2 = ["se comio", "escondio", "me robo", "destruyo"]; //La acción//
      let array3 = ["mi tarea", "mi telefono", "mi regalo", "la puerta"]; //El objetivo//
      let array4 = [
        "cuando no miraba",
        "cuando sali a comprar",
        "mientras dormia",
        "mientras estaba en clases"
      ]; //En que momento//

      //Preparación de los Array para que escoja una opcion aleatoria//
      const quien = array1[Math.floor(Math.random() * array1.length)];
      const accion = array2[Math.floor(Math.random() * array2.length)];
      const que = array3[Math.floor(Math.random() * array3.length)];
      const cuando = array4[Math.floor(Math.random() * array4.length)];

      const excusa = [quien, accion, que, cuando].join(" "); //compilación de la excusa escogiendo un opcion aleatoria de cada Array//
      document.write(excusa);
    </script>
